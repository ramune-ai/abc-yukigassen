<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ABC雪合戦</title>
<style>
  :root{
    /* セーフエリア（ノッチ・ホームバー） */
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
    /* 画面サイズに合わせて伸び縮みするUI寸法 */
    --slot:clamp(46px, 9vmin, 72px);
    --padbtn:clamp(58px, 15vmin, 80px);
    --padgap:clamp(8px, 2vmin, 12px);
    --stick:clamp(96px, 26vmin, 132px);
    --knob:calc(var(--stick) * .34);
  }
  html,body{margin:0;padding:0;overflow:hidden;width:100%;height:100%;background:#BFE7FF;
    font-family:"Hiragino Maru Gothic ProN","Rounded Mgen+",-apple-system,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;-webkit-text-size-adjust:100%;}
  #game{position:fixed;inset:0;}
  #game canvas{display:block;}
  .hud{position:fixed;pointer-events:none;z-index:10;}
  /* HP bars */
  #hpWrap{top:0;left:0;right:0;display:flex;justify-content:space-between;gap:12px;
    padding:calc(var(--sat) + 10px) calc(var(--sar) + 14px) 0 calc(var(--sal) + 14px);}
  .hpBox{flex:1;max-width:min(48%, 440px);}
  .hpName{font-size:clamp(12px, 2.4vmin, 16px);font-weight:bold;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);margin-bottom:3px;white-space:nowrap;}
  .hpBar{height:clamp(10px, 2vmin, 14px);border-radius:8px;background:rgba(255,255,255,.45);overflow:hidden;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15);display:flex;}
  #cHp .hpBar{justify-content:flex-end;}
  .hpFill{height:100%;border-radius:6px;transition:width .25s;flex:none;}
  #pHp .hpFill{background:linear-gradient(90deg,#FF8FB1,#FF5D8F);}
  #cHp .hpFill{background:linear-gradient(90deg,#B79CFF,#8E6CF0);}
  /* hand slots */
  .slotRow{display:flex;gap:clamp(5px, 1.2vmin, 8px);}
  .underbar{display:flex;align-items:flex-start;gap:10px;margin-top:6px;justify-content:flex-end;}
  #cHp .underbar{justify-content:flex-end;}
  .buffCol{display:flex;flex-direction:column;gap:4px;padding-top:2px;}
  #buffs,#cbuffs{display:flex;flex-direction:column;gap:5px;}
  .buff{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.78);border-radius:12px;padding:4px 10px;font-size:clamp(11px, 2.2vmin, 14px);font-weight:bold;box-shadow:0 2px 6px rgba(0,0,0,.12);}
  .buff .bt{height:5px;border-radius:3px;background:rgba(0,0,0,.12);width:clamp(30px, 7vmin, 54px);overflow:hidden;}
  .buff .bt i{display:block;height:100%;border-radius:3px;}
  .slot{width:var(--slot);height:var(--slot);border-radius:calc(var(--slot) * .22);background:rgba(255,255,255,.6);border:2px solid #fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.12);box-sizing:border-box;}
  .slot .ch{font-size:calc(var(--slot) * .5);font-weight:900;line-height:1;}
  .slot .lb{font-size:calc(var(--slot) * .165);color:#666;margin-top:2px;white-space:nowrap;}
  .slot .sh{font-size:calc(var(--slot) * .165);color:#444;font-weight:bold;white-space:nowrap;}
  /* 縦長スマホ：持ち物とバフを縦に積む */
  @media (max-width:560px){
    .underbar{flex-direction:column!important;align-items:flex-start;gap:4px;}
    #cHp .underbar{align-items:flex-end;}
    .slotRow{order:1;}
    .buffCol{order:2;flex-direction:row;flex-wrap:wrap;}
    .buff{padding:2px 6px;}
  }
  /* 横向きスマホ（高さが低い）：HUDをコンパクトに */
  @media (max-height:500px){
    #hpWrap{padding-top:calc(var(--sat) + 6px);}
    .hpBox{max-width:min(40%, 360px);}
    .underbar{margin-top:4px;}
    .buff{padding:2px 7px;}
  }
  /* message popup */
  #msg{top:44%;left:0;right:0;text-align:center;font-size:clamp(18px, 4.2vmin, 30px);font-weight:900;color:#fff;
    padding:0 calc(var(--sar) + 16px) 0 calc(var(--sal) + 16px);
    text-shadow:0 2px 0 rgba(0,0,0,.25),0 0 14px rgba(255,255,255,.6);opacity:0;transition:opacity .2s;}
  /* 拾えるヒント：HUDの直下に出す（topはJSでHUDの高さに合わせる） */
  #pickupTip{top:var(--hudBottom, 168px);left:0;right:0;text-align:center;padding:0 16px;}
  #pickupTip .inner{display:inline-block;max-width:min(520px, 100%);box-sizing:border-box;background:rgba(255,255,255,.85);border-radius:14px;
    padding:clamp(5px, 1.2vmin, 8px) clamp(10px, 2.4vmin, 16px);font-size:clamp(12px, 2.4vmin, 16px);font-weight:bold;color:#444;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  /* touch UI */
  /* スマホ：右下に2×2のボタングリッド */
  #pad{position:fixed;z-index:20;right:calc(var(--sar) + 14px);bottom:calc(var(--sab) + 16px);
    display:grid;grid-template-columns:repeat(2,var(--padbtn));grid-template-rows:repeat(2,var(--padbtn));gap:var(--padgap);}
  .padbtn{border:none;border-radius:calc(var(--padbtn) * .24);font-weight:900;color:#fff;font-size:calc(var(--padbtn) * .2);
    box-shadow:0 3px 10px rgba(0,0,0,.22);touch-action:none;-webkit-tap-highlight-color:transparent;padding:0;
    display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;font-family:inherit;}
  #btnGuard{background:#4FA8FF;}
  #btnThrow{background:#FF5D8F;}
  #btnPickS{background:#7C9CFF;font-size:calc(var(--padbtn) * .17);}
  #btnPickW{background:#5DD66B;font-size:calc(var(--padbtn) * .17);}
  #stick{position:fixed;z-index:20;left:calc(var(--sal) + 28px);bottom:calc(var(--sab) + 22px);width:var(--stick);height:var(--stick);border-radius:50%;
    background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.7);touch-action:none;box-sizing:border-box;}
  #stickKnob{position:absolute;left:50%;top:50%;width:var(--knob);height:var(--knob);margin:calc(var(--knob) / -2) 0 0 calc(var(--knob) / -2);
    border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.2);}
  /* overlays */
  .overlay{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(120,180,255,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:center;box-sizing:border-box;
    padding:calc(var(--sat) + 16px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);}
  .card{background:rgba(255,255,255,.92);border-radius:24px;padding:clamp(16px, 3vmin, 24px) clamp(18px, 3.5vmin, 28px);
    width:100%;max-width:440px;max-height:100%;overflow-y:auto;box-sizing:border-box;box-shadow:0 8px 30px rgba(0,0,0,.18);
    touch-action:pan-y;-webkit-overflow-scrolling:touch;}
  .card h1{margin:0 auto 6px;width:fit-content;font-size:clamp(24px, 5vmin, 32px);letter-spacing:.05em;
    background:linear-gradient(90deg,#FF5D8F,#FFB13D,#5DD66B,#4FA8FF,#8E6CF0);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .card p{font-size:clamp(12px, 2.2vmin, 14px);color:#555;margin:8px 0;line-height:1.7;}
  .card .types{font-size:clamp(13px, 2.4vmin, 15px);font-weight:bold;margin:6px 0;}
  .bigbtn{margin-top:10px;border:none;border-radius:16px;padding:12px 30px;font-size:17px;font-weight:900;color:#fff;font-family:inherit;
    background:linear-gradient(90deg,#FF5D8F,#FF8FB1);box-shadow:0 4px 12px rgba(255,93,143,.4);cursor:pointer;min-height:44px;}
  .diffbtn{border:2px solid #FFB1C9;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit;
    background:#fff;color:#FF5D8F;transition:all .15s;min-height:40px;}
  .diffbtn.sel{background:linear-gradient(90deg,#FF5D8F,#FF8FB1);color:#fff;border-color:#FF5D8F;transform:scale(1.06);}
  /* 横向きスマホ：タイトルカードを横2段組みにして縦に収める */
  @media (max-height:500px) and (orientation:landscape){
    .titleCard{max-width:760px;display:grid;grid-template-columns:1fr 1fr;column-gap:22px;align-items:center;}
    .titleCard h1{grid-column:1 / -1;margin-bottom:2px;}
    .card p{margin:4px 0;line-height:1.55;}
    .card .bigbtn{margin-top:6px;}
  }
  #flash{position:fixed;inset:0;z-index:25;background:rgba(255,60,90,.35);opacity:0;pointer-events:none;transition:opacity .3s;}
  #cross{top:50%;left:50%;width:14px;height:14px;margin:-7px;z-index:9;}
  #cross:before,#cross:after{content:"";position:absolute;background:rgba(255,255,255,.9);border-radius:2px;}
  #cross:before{left:6px;top:0;width:2px;height:14px;}
  #cross:after{top:6px;left:0;width:14px;height:2px;}
  /* ガード中の見た目 */
  #guardFx{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity .12s;
    box-shadow:inset 0 0 clamp(40px, 10vmin, 90px) rgba(79,168,255,.65);}
  body.guarding #guardFx{opacity:1;}
  #guardLbl{top:calc(50% + 22px);left:0;right:0;text-align:center;font-size:clamp(13px, 2.6vmin, 17px);font-weight:900;}
  #guardLbl span{display:none;background:rgba(255,255,255,.85);border-radius:12px;padding:3px 12px;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  #guardLbl .on{color:#2F86E0;} #guardLbl .empty{color:#888;}
  body.guarding #guardLbl .on, body.guardEmpty #guardLbl .empty{display:inline-block;}
  body.guarding #slotS{box-shadow:0 0 0 3px #4FA8FF,0 0 16px #4FA8FF;background:rgba(220,238,255,.9);}
  .padbtn{transition:transform .06s, filter .06s;}
  .padbtn.held, body.guarding #btnGuard, body.guardEmpty #btnGuard{transform:scale(.92);filter:brightness(1.15);}
  /* スマホ：なげるボタン長押しドラッグ中 */
  #aimGuide{top:calc(50% + 22px);left:50%;transform:translateX(-50%);display:none;font-size:clamp(13px, 2.6vmin, 16px);font-weight:900;color:#fff;
    background:rgba(255,93,143,.9);border-radius:12px;padding:3px 12px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  body.aiming #aimGuide{display:block;}
  body.aiming.guarding #aimGuide{display:none;}
  body.aiming #cross:before, body.aiming #cross:after{background:#FF5D8F;}
  #aimCancel{position:fixed;z-index:21;display:none;right:calc(var(--sar) + 14px);top:calc(var(--hudBottom, 150px) + 8px);
    width:clamp(70px, 17vmin, 92px);height:clamp(70px, 17vmin, 92px);border-radius:50%;box-sizing:border-box;
    background:rgba(60,60,80,.45);border:3px dashed rgba(255,255,255,.85);color:#fff;font-size:26px;font-weight:900;
    flex-direction:column;align-items:center;justify-content:center;line-height:1;pointer-events:none;transition:transform .1s, background .1s;}
  #aimCancel small{font-size:9px;line-height:1.2;margin-top:3px;}
  body.aiming #aimCancel{display:flex;}
  #aimCancel.hot{background:rgba(255,70,90,.85);transform:scale(1.12);border-style:solid;}
  /* 音量設定 */
  .titleCard{position:relative;}
  .iconbtn{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:2px solid #FFB1C9;background:#fff;
    font-size:18px;cursor:pointer;padding:0;line-height:1;z-index:1;}
  .volBox{margin:10px auto 4px;max-width:320px;}
  .volRow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px;font-weight:bold;color:#555;}
  .volRow .vl{width:44px;text-align:left;white-space:nowrap;}
  .volRow .vv{width:40px;text-align:right;font-variant-numeric:tabular-nums;color:#FF5D8F;}
  .volRow input[type=range]{flex:1;accent-color:#FF5D8F;height:28px;touch-action:pan-x;}
  #volOv{z-index:35;}
  /* スマホ：対戦中の一時停止ボタン（下部中央） */
  #btnMenu{position:fixed;z-index:22;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 30px);
    width:36px;height:36px;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.55);color:#555;
    font-size:15px;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.15);touch-action:none;-webkit-tap-highlight-color:transparent;}
  /* テスト版バッジ（test.html のときだけ表示） */
  #testBadge{display:none;position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 6px);
    background:#FFB13D;color:#fff;font-size:11px;font-weight:900;padding:2px 10px;border-radius:10px;pointer-events:none;
    box-shadow:0 2px 6px rgba(0,0,0,.15);letter-spacing:.1em;}
</style>
</head>
<body>
<div id="game"></div>
<div class="hud" id="hpWrap">
  <div class="hpBox" id="pHp">
    <div class="hpName">あなた ❤️</div>
    <div class="hpBar"><div class="hpFill" style="width:100%"></div></div>
    <div class="underbar">
      <div class="buffCol" id="buffs"></div>
      <div class="slotRow" id="pSlots">
        <div class="slot" id="slotS"><div class="ch">－</div><div class="lb">バリア</div><div class="sh"></div></div>
        <div class="slot" id="slotW"><div class="ch">－</div><div class="lb">たま</div></div>
      </div>
    </div>
  </div>
  <div class="hpBox" id="cHp">
    <div class="hpName" style="text-align:right">COMくん ⛄</div>
    <div class="hpBar"><div class="hpFill" style="width:100%"></div></div>
    <div class="underbar" style="flex-direction:row-reverse">
      <div class="buffCol" id="cbuffs"></div>
      <div class="slotRow" id="cSlots">
        <div class="slot" id="cSlotW"><div class="ch">－</div><div class="lb">たま</div></div>
        <div class="slot" id="cSlotS"><div class="ch">－</div><div class="lb">バリア</div><div class="sh"></div></div>
      </div>
    </div>
  </div>
</div>
<div class="hud" id="cross"></div>
<div class="hud" id="msg"></div>
<div class="hud" id="pickupTip"><span class="inner" id="pickupTxt" style="display:none"></span></div>
<div id="flash"></div>
<div id="testBadge">TEST</div>
<div id="guardFx"></div>
<div class="hud" id="guardLbl"><span class="on">🛡️ ガード中</span><span class="empty">バリアを持っていない！</span></div>
<div class="hud" id="aimGuide">はなすと投げる</div>
<div id="aimCancel">✕<small>ここで離すと<br>キャンセル</small></div>

<div class="overlay" id="titleOv">
  <div class="card titleCard">
    <button class="iconbtn" id="btnVolOpen" aria-label="音量設定">🔊</button>
    <h1>ABC雪合戦</h1>
    <div class="tcol">
      <p>落ちてるアルファベットを拾って、右手の<b>たま</b>で投げ、左手の<b>バリア</b>でガード！<br>先に相手のHPを削ったほうの勝ち🏆</p>
      <p class="types">🔥赤 ＞ 🌿緑 ＞ 💧青 ＞ 🔥赤…</p>
      <p>相性で勝ってる攻撃は <b>バリアを一撃で粉砕</b>！<br>相性で負けてるとバリアに25%しか入らない…</p>
    </div>
    <div class="tcol">
      <p id="ctrlTxt"></p>
      <p style="font-weight:bold;margin-bottom:4px">COMくんの強さ</p>
      <div id="diffSel" style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:6px">
        <button class="diffbtn" data-d="easy">よわい</button>
        <button class="diffbtn" data-d="normal">ふつう</button>
        <button class="diffbtn" data-d="hard">つよい</button>
        <button class="diffbtn" data-d="super">超つよい</button>
      </div>
      <button class="bigbtn" id="btnStart">バトル開始！</button>
    </div>
  </div>
</div>
<div class="overlay" id="endOv" style="display:none">
  <div class="card">
    <h1 id="endTitle">WIN!</h1>
    <p id="endTxt"></p>
    <button class="bigbtn" onclick="location.reload()">もう一回！</button>
  </div>
</div>

<div class="overlay" id="pauseOv" style="display:none">
  <div class="card">
    <h1>⏸ きゅうけい中</h1>
    <p id="pauseTxt">マウスが解放されたよ。<br>モニター間の移動もこのスキにどうぞ！</p>
    <div class="volBox"></div>
    <button class="bigbtn" id="btnResume">バトルに戻る</button>
    <br><button class="bigbtn" style="background:linear-gradient(90deg,#9aa,#bcc);margin-top:8px;font-size:14px;padding:8px 20px" onclick="location.reload()">はじめから</button>
  </div>
</div>

<div class="overlay" id="volOv" style="display:none">
  <div class="card">
    <h1>🔊 おんりょう</h1>
    <div class="volBox"></div>
    <button class="bigbtn" id="btnVolClose">OK</button>
  </div>
</div>
<button id="btnMenu" style="display:none" aria-label="きゅうけい">⏸</button>

<div id="pad" style="display:none">
  <button class="padbtn" id="btnGuard">バリア</button>
  <button class="padbtn" id="btnThrow">なげる</button>
  <button class="padbtn" id="btnPickS">バリア<br>ひろう</button>
  <button class="padbtn" id="btnPickW">たま<br>ひろう</button>
</div>
<div id="stick" style="display:none"><div id="stickKnob"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{ "use strict";
// ============ 基本設定 ============
// タッチ操作UIを出すか：主な入力が指（スマホ・タブレット）のとき。
// タッチ対応ノートPCなどマウスがある端末はPC操作にする
const HAS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
const IS_MOBILE_UA = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
// 確認用：URLに ?touch=1 でスマホ操作、?pc=1 でPC操作を強制
const Q = new URLSearchParams(location.search);
const IS_TOUCH = Q.has('touch') ? true : Q.has('pc') ? false
  : HAS_TOUCH && (IS_MOBILE_UA || matchMedia('(pointer:coarse)').matches || !matchMedia('(any-pointer:fine)').matches);
const ARENA_R = 17;
const GRAV = -18;

// ============ 調整用パラメータ（試遊しながら数値をいじる場所） ============
// カメラ：上下(pitch)はラジアン。0=水平、＋で上を向く、－で下を向く
const CAM = {
  pitchInit: 0.0,    // 開始時の上下角度
  pitchMin: -0.30,   // 下を向ける限界（相手と地面が見える範囲に絞る）
  pitchMax:  0.45,   // 上を向ける限界（山なりに投げたい時用）
  dist: 3.2,         // キャラからの距離（後ろ）
  height: 1.0,       // 目線からの高さ（上）
  sensMouse: .0024,  // マウス感度
  sensTouch: .005,   // スマホ：右側ドラッグの感度
  sensAim: .004,     // スマホ：なげるボタンを押したままドラッグする時の感度
};
// 拾う：距離はすべて水平距離（カメラを下に向けなくても拾える）
const PICK = {
  autoR: 1.4,        // この距離に入ったら、空いている手へ自動で拾う
  manualR: 3.2,      // E/Q・拾うボタンで拾える距離（＝ターゲット表示の距離）
  rearmR: 2.2,       // 交換で落とした文字は、一度この距離より離れるまで自動取得しない
};

// タイプ：fire / grass / water
const TYPES = {
  fire :{color:0xF52A2A, css:'#F52A2A', emoji:'🔥', name:'炎'},
  grass:{color:0x4FC95D, css:'#4FC95D', emoji:'🌿', name:'草'},
  water:{color:0x2FB6FF, css:'#2FB6FF', emoji:'💧', name:'水'},
};
const BEATS = {fire:'grass', grass:'water', water:'fire'}; // key が value に強い

// 文字ごとの性能（dmg:攻撃力 spd:弾速 drag:空気抵抗 def:盾の硬さ trait:ひとこと）
const LETTERS = {
  A:{dmg:24, spd:24, drag:.09, def:1.05, trait:'三角どっしり。盾も攻めも安定'},
  B:{dmg:25, spd:22, drag:.11, def:1.1,  trait:'まるっと頑丈。良い盾'},
  C:{dmg:21, spd:24, drag:.12, def:.7,  trait:'開いた口…盾は少し穴あき'},
  D:{dmg:25, spd:22, drag:.11, def:1.15, trait:'片面ぴったり。守り向き'},

const VOX = new THREE.BoxGeometry(1,1,1);
const SPHERE = new THREE.SphereGeometry(1,16,16);
const CYL = new THREE.CylinderGeometry(1,1,1,14);
function buildLetter(ch, type, scale=0.32, opts={}){
  const g = new THREE.Group();
  let col=TYPES[type].color;
  if(opts.barrier){ // バリアは「明るく薄めた色」で不透明（透けないのでボコボコ・内部表示が出ない）
    const c=new THREE.Color(col); c.lerp(new THREE.Color(0xffffff),0.45); col=c.getHex(); }
  const mat = new THREE.MeshStandardMaterial({color:col, roughness:0.42, metalness:0.05});
  const rows = FONT[ch];
  const has=(x,y)=> x>=0&&x<5&&y>=0&&y<7&&rows[y][x]==='1';
  const RAD = scale*0.46;      // 球＝円柱の半径を一致させて段差をなくす
  const D = scale*0.92;        // 奥行きも半径に近づけて丸い棒に
  const node=(x,y)=>{ const m=new THREE.Mesh(SPHERE,mat);
    m.position.set((x-2)*scale,(3-y)*scale,0); m.scale.set(RAD,RAD,RAD*0.9); g.add(m); };
  const tube=(x1,y1,x2,y2)=>{ const ax=(x1-2)*scale,ay=(3-y1)*scale,bx=(x2-2)*scale,by=(3-y2)*scale;
    const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy);
    const m=new THREE.Mesh(CYL,mat); m.position.set((ax+bx)/2,(ay+by)/2,0);
    m.rotation.z=Math.atan2(dy,dx)-Math.PI/2; m.scale.set(RAD,len,RAD*0.9); g.add(m); };
  for(let y=0;y<7;y++)for(let x=0;x<5;x++){ if(!has(x,y))continue; node(x,y);
    if(has(x+1,y)) tube(x,y,x+1,y);
    if(has(x,y+1)) tube(x,y,x,y+1);
    if(has(x+1,y+1)&&!has(x+1,y)&&!has(x,y+1)) tube(x,y,x+1,y+1);
    if(has(x-1,y+1)&&!has(x-1,y)&&!has(x,y+1)) tube(x,y,x-1,y+1);
  }
  g.userData={ch,type};
  return g;
}
function buildShieldPanel(ch, type, scale){ return buildLetter(ch,type,scale,{barrier:true}); }

let AC=null;
function sfx(kind){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain(); o.connect(g); g.connect(seOut());
  const t=AC.currentTime; g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.25);
  if(kind==='throw'){o.type='triangle';o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(900,t+.15);}
  if(kind==='block'){o.type='square';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(150,t+.2);}
  if(kind==='break'){o.type='sawtooth';o.frequency.setValueAtTime(600,t);o.frequency.exponentialRampToValueAtTime(80,t+.3);}
  if(kind==='hit'){o.type='sine';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(60,t+.25);}
  if(kind==='pick'){o.type='triangle';o.frequency.setValueAtTime(700,t);o.frequency.exponentialRampToValueAtTime(1200,t+.12);}
  if(kind==='land'){o.type='triangle';g.gain.setValueAtTime(.05,t);o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(120,t+.12);}
  o.start(t); o.stop(t+.3);}catch(e){} }
// キラキラ和音（宝石の登場・取得用）
function chime(notes,gainV=0.10,step=0.07){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const t0=AC.currentTime;
  notes.forEach((f,i)=>{ const o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle'; o.connect(g); g.connect(seOut());
    const t=t0+i*step; g.gain.setValueAtTime(gainV,t); g.gain.exponentialRampToValueAtTime(.001,t+.35);
    o.frequency.setValueAtTime(f,t); o.start(t); o.stop(t+.4); });
}catch(e){} }

// ============ 投擲物 ============
const projectiles=[];
function throwLetter(owner, letter, from, dir){
  const st=LETTERS[letter.ch];
  const g=buildLetter(letter.ch,letter.type,FIELD_SCALE);
  g.position.copy(from);
  scene.add(g);
  projectiles.push({mesh:g, vel:dir.clone().multiplyScalar(st.spd), owner, letter,
    drag:st.drag, life:5, sCurve:letter.ch==='S'?(Math.random()<.5?1:-1):0, t:0});
  sfx('throw');
}
function matchupPct(att, def){ // 盾に与えるダメージ%
  if(BEATS[att]===def) return 100;       // 有利→一撃粉砕
  if(BEATS[def]===att) return 25;        // 不利
  return 50;
}

function resolveHit(p, victim, isPlayer){
  shatter(p.mesh.position.clone(), TYPES[p.letter.type].color); // 当たったら砕け散る
  const att=p.letter.type;
  const attacker = (p.owner==='player')?player:com;
  const atkMul = attacker.buffs.atk>0?1.25:1;
  const dmg=Math.round(LETTERS[p.letter.ch].dmg*atkMul);
  // ガード判定：ガード中＆盾あり＆正面から
  let blocked=false;
  if(victim.guard && victim.shield){
    // 飛んでくる弾が「自分の見ている方向」から来ていればガード成立
    const center = isPlayer ? player.pos : com.mesh.position.clone().setY(1.5);
    const toShooter = p.mesh.position.clone().sub(center).normalize(); // 自分→弾の向き
    let fw;
    if(isPlayer){ fw=aimDir(); } // プレイヤーのエイム方向
    else { fw=new THREE.Vector3(Math.sin(com.yaw),0,Math.cos(com.yaw)); }
    if(fw.dot(toShooter)>0.3){
      blocked=true;
      const base=matchupPct(att, victim.shield.type);
      const defMul = victim.buffs.def>0?1.5:1; // 防御バフで盾が硬くなる
      const pct=base>=100?100:(base/LETTERS[victim.shield.ch].def)/defMul;
      victim.shieldHP-=pct;
      if(base>=100||victim.shieldHP<=0){
        victim.shieldHP=0; victim.shield=null;
        if(isPlayer) setHand(handS,null); else setHand(com.handS,null);
        showMsg(base>=100?'💥 相性◎！バリアを一撃粉砕！！':'バリアがくだけた！','#FFD24A');
        sfx('break');
      } else {
        showMsg(base<=25?'相性✕…バリアに25%だけ':'ガード！バリア-'+Math.round(pct)+'%','#BFE7FF');
        sfx('block');
      }
    }
  }
  if(!blocked){
    const dmgFinal = Math.round(dmg * (victim.buffs.def>0?0.7:1)); // 防御バフで被ダメ軽減
    victim.hp-=dmgFinal;
    sfx('hit');
    if(isPlayer){ flash(); showMsg('-'+dmgFinal+' くらった！','#FF8FA8'); }
    else showMsg('ヒット！ -'+dmgFinal,'#A8FFC2');
  }
  updHP(); updSlots();
  if(victim.hp<=0) endGame(!isPlayer);
}

// ============ アクション ============
function aimDir(){ return new THREE.Vector3(-Math.sin(player.yaw)*Math.cos(player.pitch),
                                              Math.sin(player.pitch),
                                             -Math.cos(player.yaw)*Math.cos(player.pitch)); }
function camDir(){ return aimDir(); }
function playerThrow(){
  if(!player.weapon||!running) return;
  const from=player.pos.clone().add(aimDir().multiplyScalar(1.2));
  throwLetter('player', player.weapon, from, camDir());
  player.weapon=null; setHand(handW,null); updSlots();
}
let nearLetter=null;
const hDist=(o,p)=>Math.hypot(o.position.x-p.x, o.position.z-p.z); // 水平距離
function dropLetterAt(ch,type,dur,x,z){
  const g=buildLetter(ch,type,FIELD_SCALE);
  g.userData.vy=0; g.userData.dur=(dur===undefined?100:dur);
  scene.add(g); fieldLetters.push(g);
  landLetter(g,x,z);
  return g;
}
// 地面の文字 g を slot（'weapon' / 'shield'）に装備。持っていた物はその場に置く（被ダメは記憶したまま）
function equipFromField(g, slot, auto){
  const px=g.position.x, pz=g.position.z;
  const incoming={ch:g.userData.ch, type:g.userData.type, dur:g.userData.dur};
  const prev = slot==='weapon' ? player.weapon : player.shield;
  const prevDur = slot==='weapon' ? 100 : player.shieldHP;
  scene.remove(g); fieldLetters.splice(fieldLetters.indexOf(g),1);
  if(slot==='weapon'){ player.weapon=incoming; setHand(handW,incoming,0.21); }
  else { player.shield=incoming; player.shieldHP=(incoming.dur===undefined?100:incoming.dur); setHand(handS,incoming,0.21,true); }
  // 交換で落とした文字は、一度離れるまで自動取得しない（即拾い直し防止）
  if(prev){ const d=dropLetterAt(prev.ch,prev.type,prevDur,px,pz); d.userData.noAuto=true; }
  if(g===nearLetter) nearLetter=null;
  sfx('pick'); updSlots();
  if(auto) showMsg(TYPES[incoming.type].emoji+' '+incoming.ch+(slot==='weapon'?' をたまに！':' をバリアに！'), TYPES[incoming.type].css);
}
function tryPick(slot){
  if(!nearLetter||!running) return;
  equipFromField(nearLetter, slot, false);
}
// 取得範囲に入った文字を空いている手へ自動で拾う（両手空き→たま優先／たまあり＆バリア空き→バリア）
function autoPick(){
  const slot = !player.weapon ? 'weapon' : !player.shield ? 'shield' : null;
  for(const f of fieldLetters){ if(!f.userData.landed) continue;
    const d=hDist(f,player.pos);
    if(f.userData.noAuto){ if(d>PICK.rearmR) f.userData.noAuto=false; continue; }
    if(slot && d<PICK.autoR){ equipFromField(f, slot, true); return; } }
}

function setLetterOpacity(g,op){ g.traverse(o=>{ if(o.material){ o.material.transparent=op<1; o.material.opacity=op; } }); }

// ============ COM AI ============
function comAI(dt){
  com.timer-=dt;
  const toPlayer=player.pos.clone().setY(0).sub(com.pos.clone().setY(0));
  const dist=toPlayer.length();
  com.yaw=Math.atan2(toPlayer.x,toPlayer.z);
  com.mesh.rotation.y=com.yaw;
  // ガード解除タイマー
  if(com.guard){ com.guardT-=dt; if(com.guardT<=0) com.guard=false; }
  let move=new THREE.Vector3();
  if(!com.weapon||!com.shield){
    // 一番近い文字へ
    let best=null,bd=1e9;
    for(const f of fieldLetters){ if(!f.userData.landed)continue;
      const d=f.position.distanceTo(com.pos);if(d<bd){bd=d;best=f;}}
    if(best){ move=best.position.clone().setY(0).sub(com.pos.clone().setY(0)).normalize();
      if(bd<1.6){ const data={ch:best.userData.ch,type:best.userData.type,dur:best.userData.dur};
        const bx=best.position.x, bz=best.position.z;
        scene.remove(best); fieldLetters.splice(fieldLetters.indexOf(best),1);
        if(!com.weapon){com.weapon=data; setHand(com.handW,data,0.18);}
        else {com.shield=data; com.shieldHP=(data.dur===undefined?100:data.dur); setHand(com.handS,data,0.18);} updSlots(); } }
  } else {
    // まず、近くに宝石があれば（難易度の積極性に応じて）取りに行く
    let gemTarget=null, gd=1e9;
    if(DIFF.itemAggro>0){
      for(const gm of gems){ if(!gm.userData.landed)continue;
        const d=Math.hypot(gm.position.x-com.pos.x, gm.position.z-com.pos.z);
        if(d<gd){gd=d;gemTarget=gm;} }
      if(gemTarget && gd>DIFF.itemAggro) gemTarget=null; // 範囲外なら無視
    }
    // 距離キープ＆横移動（たまに立ち止まる）
    com.moveT=(com.moveT||0)-dt;
    if(com.moveT<=0){ com.moveOn=!com.moveOn;
      com.moveT=com.moveOn?(1.0+Math.random()*1.5):(0.6+Math.random()*1.0); }
    const side=new THREE.Vector3(-toPlayer.z,0,toPlayer.x).normalize().multiplyScalar(Math.sin(performance.now()*.0007)*1);
    if(gemTarget){ // 宝石優先
      move=new THREE.Vector3(gemTarget.position.x-com.pos.x,0,gemTarget.position.z-com.pos.z).normalize();
    } else {
      if(dist>11) move=toPlayer.clone().normalize();
      else if(dist<5) move=toPlayer.clone().normalize().negate();
      move.add(side).normalize();
      if(!com.moveOn) move.set(0,0,0);
    }
    // 投げる（命中率ひかえめ）
    if(com.timer<=0 && dist<22){
      const eye=com.pos.clone().add(new THREE.Vector3(0,1.5,0));
      const tgt=player.pos.clone().add(new THREE.Vector3((Math.random()-.5)*DIFF.aim,(Math.random()-.5)*DIFF.aim*0.45,(Math.random()-.5)*DIFF.aim));
      const dir=tgt.sub(eye); const fl=dir.length();
      dir.normalize(); dir.y += fl*.012; dir.normalize(); // 重力ぶん上方補正
      throwLetter('com', com.weapon, eye, dir);
      com.weapon=null; setHand(com.handW,null);
      com.timer=DIFF.throwMin+Math.random()*DIFF.throwRand;
    }
  }
  com.pos.add(move.multiplyScalar(dt*2.6*DIFF.moveMul*(com.buffs.speed>0?1.5:1)));
  const r=Math.hypot(com.pos.x,com.pos.z); if(r>ARENA_R-1){com.pos.x*= (ARENA_R-1)/r; com.pos.z*=(ARENA_R-1)/r;}
  com.mesh.position.copy(com.pos);
}

// ============ ゲームループ ============
let running=false, last=performance.now(), spawnTimer=2.5, gemTimer=6;
function endGame(playerWon){
  running=false; player.guard=false; aim.id=null;
  document.body.classList.remove('aiming','guarding','guardEmpty');
  $('endTitle').textContent = playerWon?'🏆 WIN!':'😵 LOSE...';
  $('endTxt').textContent = playerWon?'COMくんに勝った！すごい！🎉':'次はタイプ相性でバリアを砕こう…！';
  $('endOv').style.display='flex'; $('btnMenu').style.display='none'; playBgm('title');
  if(document.pointerLockElement) document.exitPointerLock();
}
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(); let dt=Math.min(.05,(now-last)/1000); last=now;
  if(paused){ renderer.render(scene,camera); return; }
  // フィールドのアルファベットを一定数キープ（足りなければ降らせる）
  spawnTimer-=dt;
  if(spawnTimer<=0){ spawnTimer=2.5;
    if(fieldLetters.length<14) spawnFieldLetter(); }
  // 落下中の文字
  for(const f of fieldLetters){ if(f.userData.landed) continue;
    f.userData.vy+=GRAV*dt; f.position.y+=f.userData.vy*dt; f.rotation.y+=dt*2;
    if(f.position.y<=FIELD_SCALE*0.6){ landLetter(f,f.position.x,f.position.z); sfx('land'); } }
  // 砕け破片
  for(let i=parts.length-1;i>=0;i--){const q=parts[i]; q.life-=dt; q.vel.y+=GRAV*dt;
    q.m.position.addScaledVector(q.vel,dt); q.m.scale.multiplyScalar(.94);
    if(q.life<=0){scene.remove(q.m);parts.splice(i,1);} }
  if(!running){ renderer.render(scene,camera); return; }

  // 宝石アイテムの出現（中央付近にときどき降ってくる）
  gemTimer-=dt;
  if(gemTimer<=0){ gemTimer=9+Math.random()*5; if(gems.length<3) spawnGem(); }
  // 宝石の落下→目線位でホバリング・ゆっくり回転・取得
  const HOVER=1.5; // キャラの目線あたり
  for(let i=gems.length-1;i>=0;i--){ const gm=gems[i];
    if(!gm.userData.landed){ gm.userData.vy+=GRAV*dt; gm.position.y+=gm.userData.vy*dt;
      if(gm.position.y<=HOVER){ gm.position.y=HOVER; gm.userData.landed=true; sfx('land'); } }
    else { gm.userData.bob+=dt*1.4; gm.position.y=HOVER+Math.sin(gm.userData.bob)*0.18; }
    gm.rotation.y+=dt*0.9; // ゆっくり輝きながら回転
    // きらめき（芯の明滅）
    const core=gm.children[2]; if(core) core.material.opacity=0.6+Math.abs(Math.sin(gm.userData.bob*1.5))*0.4;
    // 取得判定（プレイヤー or COM）
    const grabber = gm.position.distanceTo(new THREE.Vector3(player.pos.x,gm.position.y,player.pos.z))<1.4 ? player
                  : gm.position.distanceTo(new THREE.Vector3(com.pos.x,gm.position.y,com.pos.z))<1.4 ? com : null;
    if(grabber){ const k=gm.userData.kind;
      grabber.buffs[k]=GEMS[k].dur;
      if(grabber===player){ chime([1047,1319,1568,2093],0.12); showMsg(GEMS[k].emoji+' '+GEMS[k].label+'！',GEMS[k].css); }
      else chime([784,988,1175],0.08);
      scene.remove(gm); gems.splice(i,1); }
  }
  // バフのカウントダウン
  for(const ow of [player,com]) for(const k of GKEYS){ if(ow.buffs[k]>0){ ow.buffs[k]-=dt; if(ow.buffs[k]<0) ow.buffs[k]=0; } }
  updBuffHUD();

  // プレイヤー移動
  let mx=0,mz=0;
  if(IS_TOUCH){ mx=stickVec.x; mz=stickVec.y; }
  else { mz=(keys.KeyW?-1:0)+(keys.KeyS?1:0); mx=(keys.KeyD?1:0)+(keys.KeyA?-1:0); }
  const spd=(player.guard?5.2*0.40:5.2)*(player.buffs.speed>0?1.5:1);
  const fw=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
  const rt=new THREE.Vector3(-fw.z,0,fw.x); // 視点基準の右ベクトル
  player.pos.add(fw.clone().multiplyScalar(-mz*spd*dt)).add(rt.clone().multiplyScalar(mx*spd*dt));
  const pr=Math.hypot(player.pos.x,player.pos.z);
  if(pr>ARENA_R-1){player.pos.x*=(ARENA_R-1)/pr;player.pos.z*=(ARENA_R-1)/pr;}
  // プレイヤーキャラの配置（player.pos は目線基準なので足元へ変換）
  const feet=player.pos.clone(); feet.y=0;
  playerMesh.position.copy(feet);
  playerMesh.rotation.y=player.yaw+Math.PI; // 顔を前方へ

  // TPSカメラ：キャラの真後ろ上方からエイム方向を見る（中央配置）
  const aim=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw)); // 前方(水平)
  const look=new THREE.Vector3(-Math.sin(player.yaw)*Math.cos(player.pitch),
                                Math.sin(player.pitch),
                               -Math.cos(player.yaw)*Math.cos(player.pitch)); // エイム(上下込み)
  const headPos=player.pos.clone(); // 目線高さ
  const camPos=headPos.clone().addScaledVector(aim,-CAM.dist).add(new THREE.Vector3(0,CAM.height,0));
  const cr=Math.hypot(camPos.x,camPos.z); if(cr>ARENA_R+4){camPos.x*=(ARENA_R+4)/cr;camPos.z*=(ARENA_R+4)/cr;}
  camera.position.lerp(camPos,0.4);
  const focus=headPos.clone().addScaledVector(look,6);
  camera.lookAt(focus);

  // 自キャラが視界をふさぐ時に薄くする
  {
    const pv=playerMesh.position.clone(); pv.y=1.4;
    const cv=com.mesh.position.clone(); cv.y=1.4;
    const ps=pv.clone().project(camera);
    const cs=cv.clone().project(camera);
    // 相手が画面上で自キャラと近い位置（＝後ろに隠れがち）。距離に関係なく効く
    const bothFront = ps.z<1 && cs.z<1;
    const overlap = bothFront && Math.abs(ps.x-cs.x)<0.30 && Math.abs(ps.y-cs.y)<0.55;
    // 見上げ／見下ろしで体が視界に大きくせり出す時
    const pitchBlock = player.pitch>0.30 || player.pitch<-0.22;
    const fade = overlap || pitchBlock;
    // 手に持っているもの（たま・バリア）は薄くしない＝内部の球が見えない
    const skip=new Set(); handW.traverse(o=>skip.add(o)); handS.traverse(o=>skip.add(o));
    playerMesh.traverse(o=>{ if(o.material && !skip.has(o)){ o.material.transparent=true;
      o.material.opacity += ((fade?0.45:1.0)-o.material.opacity)*0.3; } });
  }

  // 盾の構え演出（キャラのローカル空間：前方に掲げる）
  handS.position.lerp(player.guard?new THREE.Vector3(0,1.3,0.95):new THREE.Vector3(.7,1.15,.4),.25);
  handS.scale.setScalar(1);
  handW.rotation.y+= dt*2;
  com.handW.rotation.y+= dt*2;

  // ガード中の見た目（足元リング・画面のふち・バリア欄の光）
  updGuardFx(dt);

  // 空いている手へ自動で拾う
  autoPick();
  // 拾える文字（水平距離で一番近いもの）＝E/Q・拾うボタンの対象
  const prevNear=nearLetter;
  nearLetter=null; let nd=PICK.manualR;
  for(const f of fieldLetters){ if(!f.userData.landed)continue;
    const d=hDist(f,player.pos);if(d<nd){nd=d;nearLetter=f;}}
  if(prevNear && prevNear!==nearLetter) setLetterOpacity(prevNear,1); // 前の対象の点滅を戻す
  const tip=$('pickupTxt');
  if(nearLetter){ const u=nearLetter.userData, st=LETTERS[u.ch];
    tip.style.display='inline-block';
    const wTxt=player.weapon?'たまと交換':'たまにする', sTxt=player.shield?'バリアと交換':'バリアにする';
    tip.innerHTML=`${TYPES[u.type].emoji} <b style="color:${TYPES[u.type].css}">${u.ch}</b>：${st.trait}` +
      (IS_TOUCH?'':`<br><b>E</b> ${wTxt} ／ <b>Q</b> ${sTxt}`);
    const blink=0.45+Math.abs(Math.sin(performance.now()*0.006))*0.55; // やさしい点滅
    setLetterOpacity(nearLetter,blink);
    // 頭上のマーカー（カメラを下に向けなくても、どれが対象か分かる）
    targetMark.visible=true;
    targetMark.position.set(nearLetter.position.x, 1.15+Math.sin(performance.now()*0.005)*0.12, nearLetter.position.z);
    targetMark.rotation.y+=dt*2.5;
    targetMark.userData.setColor(TYPES[u.type].color);
    if(IS_TOUCH){$('btnPickW').style.opacity='1';$('btnPickS').style.opacity='1';
      $('btnPickW').innerHTML=player.weapon?'たま<br>こうかん':'たま<br>ひろう';
      $('btnPickS').innerHTML=player.shield?'バリア<br>こうかん':'バリア<br>ひろう';}
  } else { tip.style.display='none'; targetMark.visible=false;
    if(IS_TOUCH){$('btnPickW').style.opacity='0.4';$('btnPickS').style.opacity='0.4';} }

  // COM
  comAI(dt);
  // COM盾の構え
  com.handS.position.lerp(com.guard?new THREE.Vector3(0,1.3,0.6):new THREE.Vector3(.7,1.15,.4),.2);
  com.handS.scale.setScalar(1);

  // 投擲物
  for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];
    p.t+=dt; p.life-=dt;
    p.vel.y+=GRAV*dt;
    p.vel.multiplyScalar(1-p.drag*dt*3);
    if(p.sCurve) p.vel.add(new THREE.Vector3(Math.cos(p.t*6)*p.sCurve*8*dt,0,0));
    p.mesh.position.addScaledVector(p.vel,dt);
    p.mesh.rotation.x+=dt*7; p.mesh.rotation.y+=dt*5;
    // COMのガード反応：プレイヤー弾が接近したら
    if(p.owner==='player' && com.shield && !com.guard &&
       p.mesh.position.distanceTo(com.pos)<11 && Math.random()<DIFF.guardP){ com.guard=true; com.guardT=1.1; }
    // 当たり判定
    if(p.owner==='player'){
      const cc=com.pos.clone().add(new THREE.Vector3(0,1.3,0));
      if(p.mesh.position.distanceTo(cc)<1.25){ resolveHit(p,com,false); scene.remove(p.mesh); projectiles.splice(i,1); continue; }
    } else {
      if(p.mesh.position.distanceTo(player.pos)<1.05){ resolveHit(p,player,true); scene.remove(p.mesh); projectiles.splice(i,1); continue; }
    }
    if(p.mesh.position.y<0.18){ // 外れた→落下地点に転がって残る
      let lx=p.mesh.position.x, lz=p.mesh.position.z;
      const lr=Math.hypot(lx,lz); if(lr>ARENA_R-1){lx*=(ARENA_R-1)/lr;lz*=(ARENA_R-1)/lr;}
      landLetter(p.mesh,lx,lz); fieldLetters.push(p.mesh); sfx('land');
      projectiles.splice(i,1); continue; }
    if(p.life<=0){ scene.remove(p.mesh); projectiles.splice(i,1); }
  }
  renderer.render(scene,camera);
}
loop();

// ============ スタート ============
$('ctrlTxt').innerHTML = IS_TOUCH
 ? '🕹️ 左スティック：移動　／　右側ドラッグ：視点<br>「なげる」を押したままドラッグでねらって、はなすと投げる<br>（右上の ✕ で離すとキャンセル）　「バリア」長押し：ガード<br>文字に近づくと空いてる手に自動で持つ。交換は「ひろう」ボタン'
 : '🖱️ クリックで視点ロック　WASD：移動　マウス：視点<br>左クリック：投げる　右クリック長押し：ガード<br>文字に近づくと空いてる手に自動で持つ<br>交換は E=たま / Q=バリア<br><small>※対戦中はマウスが画面に固定されます。<b>ESC</b>で解放、クリックで再開</small>';
// 難易度選択
const diffBtns=document.querySelectorAll('.diffbtn');
function selectDiff(key){ DIFF=DIFFS[key];
  diffBtns.forEach(b=>b.classList.toggle('sel', b.dataset.d===key)); }
diffBtns.forEach(b=>b.addEventListener('click',()=>{ selectDiff(b.dataset.d); sfx('pick'); }));
selectDiff('normal'); // 初期は「ふつう」

$('btnStart').addEventListener('click',()=>{
  $('titleOv').style.display='none'; running=true; sfx('pick'); playBgm('battle');
  if(IS_TOUCH) $('btnMenu').style.display='block';
  if(!IS_TOUCH) renderer.domElement.requestPointerLock();
});
updSlots(); updHP();
// 「拾える」ヒントをHUDのすぐ下に置く（HUDの高さは画面サイズ・バフ表示で変わる）
{ const hud=$('hpWrap');
  const place=()=>document.documentElement.style.setProperty('--hudBottom',(hud.getBoundingClientRect().bottom+8)+'px');
  place(); if(window.ResizeObserver) new ResizeObserver(place).observe(hud); addEventListener('resize',place); }
// 音量設定（タイトルの🔊）
$('btnVolOpen').addEventListener('click',()=>{ $('volOv').style.display='flex'; });
$('btnVolClose').addEventListener('click',()=>{ $('volOv').style.display='none'; });
// スマホ：対戦中の⏸ボタンで一時停止（音量もここで変えられる）
if(IS_TOUCH){
  $('pauseTxt').innerHTML='ひと休み。音量もここで変えられるよ';
  $('btnMenu').addEventListener('click',()=>{ if(!running||paused) return;
    paused=true; player.guard=false; stickVec={x:0,y:0}; aim.id=null; document.body.classList.remove('guarding','guardEmpty','aiming');
    $('pauseOv').style.display='flex'; });
  $('btnResume').addEventListener('click',()=>{ $('pauseOv').style.display='none'; paused=false; last=performance.now(); });
}
// 動作確認用（URLに ?debug=1 のときだけ内部状態を触れるようにする）
if(Q.has('debug')) window.__g={player,com,fieldLetters,dropLetterAt,PICK,CAM};
// テスト版の目印（test.html で開いたときだけ）
if(/test\.html$/i.test(location.pathname)) $('testBadge').style.display='block';
})();
</script>
</body>
</html>
